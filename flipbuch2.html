<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kapitänin Kapita in Enceladus</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
</head>

<body>

  <div class="stars"></div>

  <main class="book-area">

    <div class="book-header">
      <h1>Kapitänin Kapita</h1>
      <p>Mission Enceladus</p>
    </div>

    <div class="book-container">

      <button class="nav-btn prev-btn" id="prevPage" aria-label="Vorherige Seite">
        ❮
      </button>

      <div id="flipbook"></div>

      <button class="nav-btn next-btn" id="nextPage" aria-label="Nächste Seite">
        ❯
      </button>

    </div>

    <div class="book-controls">

      <button id="audioButton">
        🔊 Audio
      </button>

      <span id="pageCounter">
        Seite 1
      </span>

      <button id="fullscreenButton">
        ⛶ Vollbild
      </button>

    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
