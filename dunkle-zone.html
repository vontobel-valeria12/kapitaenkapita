<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dunkle Zone
  </title>


  <!-- CSS DO LIVRO -->

  <link
    rel="stylesheet"
    href="flipbuch2.css"
  >


  <!-- BIBLIOTECA PAGE FLIP -->

  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>

</head>


<body data-book-id="13-dunkle-des-teuf">




  <div class="stars"></div>



  <main class="book-area">


    <!-- ===================================================
         CABEÇALHO
    ==================================================== -->

    <header class="book-header">

      <h1>
       Dunkle Zone 
      </h1>

      <p>
       Ich war verliebt.
      </p>

    </header>


    <!-- =====================================================
         CONTAINER DO LIVRO
    ====================================================== -->

    <div class="book-container">


      <!-- =================================================
           FLIPBOOK
      ================================================== -->

      <div id="flipbook">


        <!-- =================================================
             PÁGINA 1
             CAPA
        ================================================== -->

        <div class="page cover">

          <img
            src="img/#"
            alt="dunkel Zone"
          >

        </div>


        <!-- =================================================
             PÁGINA 2
             PRÉVIA DO LIVRO
        ================================================== -->

        <div class="page reading-page">

          <div class="page-content">

            <img
              src="img/#"
              alt="Buchcover: previa do livro"
              class="page-image"
            >


            <div class="reading-text">

              <div class="book-text auto-scroll">

                <h2>
                  #                
                </h2>

  <p>
    Ich war verliebt. Hals über Kopf verliebt.
  </p>


              </div>

            </div>

          </div>

        </div>


      </div>
      <!-- FIM DO FLIPBOOK -->


    </div>
    <!-- FIM DO CONTAINER DO LIVRO -->


    <!-- ===================================================
         CONTROLES DO LIVRO
    ==================================================== -->

    <nav
      class="book-controls"
      aria-label="Buchsteuerung"
    >


      <!-- ÁUDIO -->

      <button
        id="audioButton"
        type="button"
      >
        🔊 Vorlesen
      </button>


      <!-- MODO DE LEITURA -->

      <button
        id="readingModeButton"
        type="button"
      >
        📖 Lesemodus
      </button>


      <!-- VISÃO GERAL DAS PÁGINAS -->

      <button
        id="pageMenuButton"
        type="button"
        aria-label="Seitenübersicht öffnen"
      >
        ▦ Seiten
      </button>


      <!-- =================================================
           NAVEGAÇÃO
      ================================================== -->

      <div class="page-navigation">

        <button
          id="prevPage"
          class="page-nav-btn"
          type="button"
          aria-label="Vorherige Seite"
        >
          ‹
        </button>


        <span id="pageCounter">
          Seite 1
        </span>


        <button
          id="nextPage"
          class="page-nav-btn"
          type="button"
          aria-label="Nächste Seite"
        >
          ›
        </button>

      </div>


      <!-- TELA CHEIA -->

      <button
        id="fullscreenButton"
        type="button"
      >
        ⛶ Vollbild
      </button>


      <!-- SAIR DO LIVRO -->

      <button
        id="exitBookButton"
        type="button"
        data-exit-url="index.html"
      >
        ✕ Beenden
      </button>


    </nav>


  </main>


  <!-- =====================================================
       PAINEL LATERAL DE PÁGINAS
  ====================================================== -->

  <div
    id="pageMenu"
    class="page-sidebar"
    aria-hidden="true"
  >


    <aside
      class="page-sidebar-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="pageMenuTitle"
    >


      <!-- CABEÇALHO DO PAINEL -->

      <div class="page-sidebar-header">

        <h2 id="pageMenuTitle">
          Seiten
        </h2>


        <button
          id="closePageMenu"
          class="close-page-menu"
          type="button"
          aria-label="Seitenübersicht schließen"
        >
          ✕
        </button>

      </div>


      <!--
        O JAVASCRIPT VAI CRIAR
        AS MINIATURAS DAS PÁGINAS AQUI
      -->

      <div
        id="pageList"
        class="page-thumbnail-list"
      >
      </div>


    </aside>


  </div>


  <!-- =====================================================
       JAVASCRIPT GERAL DO LIVRO
  ====================================================== -->

  <script src="book.js"></script>


</body>

</html>
